# Dotmate 配置文件示例
# 复制此文件为 config.yaml 并填入你的实际配置

# 平台配置：按厂商分组，每个平台有自己的 api_key
platforms:
  # Quote/0 平台（dot.mindreset.tech，分辨率 296x152，支持文本+图片）
  quote0:
    api_key: "your-quote0-api-key-here"

  # Zectrix Note 4 平台（cloud.zectrix.com，分辨率 400x300，仅图片）
  # 格式 zt_...；获取地址：https://cloud.zectrix.com/home/api-keys
  zectrix:
    api_key: "zt_your-zectrix-api-key-here"

# 请求间隔（秒），防止短时间内发送过多 API 请求（可选，默认 1.0）
request_interval: 1.0

# 设备列表
devices:
  # 设备示例 1：办公室设备（Quote/0，默认 platform=quote0，分辨率 296x152）
  - name: "办公室设备"
    device_id: "office-device-001"
    platform: quote0  # 可选，默认 quote0
    # 在图像右下角显示电池和刷新时间（仅对图像类型生效）
    show_battery_icon: true
    show_battery_percentage: true
    show_refresh_time: true
    schedules:
      # 每5分钟检查代码状态
      - cron: "*/5 * * * *"
        type: code_status
        params:
          wakatime_url: "https://wakatime.com"
          wakatime_api_key: "your-wakatime-api-key-here"
          wakatime_user_id: "your-username"

      # 工作日每小时发送工作倒计时（朝九晚六）
      - cron: "0 9-18 * * 1-5"
        type: work
        params:
          clock_in: "09:00"
          clock_out: "18:00"

      # 每天中午12点发送午餐提醒
      - cron: "0 12 * * *"
        type: text
        params:
          title: "午餐时间"
          message: "该吃午饭了！"

      # 每天下午6点发送下班提醒
      - cron: "0 18 * * 1-5"
        type: text
        params:
          title: "下班时间"
          message: "今天辛苦了，记得整理桌面！"

  # 设备示例 2：家用设备，仅文本消息
  - name: "家用设备"
    device_id: "home-device-001"
    platform: quote0
    schedules:
      # 每天早上8点发送天气提醒
      - cron: "0 8 * * *"
        type: text
        params:
          title: "早安"
          message: "新的一天开始了，记得查看今日天气！"

      # 每天晚上10点发送睡眠提醒
      - cron: "0 22 * * *"
        type: text
        params:
          title: "睡眠提醒"
          message: "该准备休息了，晚安！"

  # 设备示例 3：Zectrix Note 4（分辨率 400x300，仅走图片 API）
  # 需配置 platforms.zectrix.api_key；device_id 为设备 MAC 地址
  # 注意：note4 平台不支持 text 类型，配置 text 任务会在加载时报错
  - name: "Note4 便利贴"
    device_id: "AA:BB:CC:DD:EE:FF"
    platform: zectrix
    # 也可在设备级覆盖密钥：api_key: "zt_xxx"
    schedules:
      # 每 15 分钟推送标题图（布局会按 400x300 自适应）
      - cron: "*/15 * * * *"
        type: title_image
        params:
          main_title: "Note 4"
          sub_title: "Hello Zectrix"
          dither_type: "NONE"
          page_id: "1"

      # 工作日倒计时
      - cron: "*/10 9-18 * * 1-5"
        type: work
        params:
          clock_in: "09:00"
          clock_out: "18:00"
          page_id: "1"

  # 设备示例 4：开发环境设备，代码状态监控
  - name: "开发环境"
    device_id: "dev-device-001"
    platform: quote0
    schedules:
      # 每2分钟检查代码状态
      - cron: "*/2 * * * *"
        type: code_status
        params:
          wakatime_url: "https://your.wakatime.site"
          wakatime_api_key: "your-wakatime-api-key-here"
          wakatime_user_id: "your-username"
          dither_type: "NONE"
          link: "https://your.wakatime.site"

      # 每30分钟更新网站统计数据
      - cron: "*/30 * * * *"
        type: umami_stats
        params:
          umami_host: "https://your.umami.site"
          umami_website_id: "your-website-id-here"
          umami_api_key: "your-umami-api-key-here"
          umami_time_range: "24h"
          dither_type: "NONE"

      # 每天早上9点更新 GitHub 贡献图
      - cron: "0 9 * * *"
        type: github_contributions
        params:
          github_username: "your-github-username"
          github_token: "ghp_xxxxxxxxxxxxx"
          dither_type: "NONE"
          link: "https://github.com/your-github-username"

      # 每15分钟更新代码计划用量
      - cron: "*/15 * * * *"
        type: code_plan_usage
        params:
          api_url: "http://your.onwatch.site"
          provider: "anthropic"
          api_username: "your-username"
          api_password: "your-password"
          dither_type: "NONE"

      # 工作时间每30分钟提醒休息
      - cron: "*/30 9-17 * * 1-5"
        type: text
        params:
          title: "休息提醒"
          message: "工作30分钟了，该休息一下了！"

# 配置说明：
#
# platforms:                   按厂商分组的平台配置
#   <platform_name>:
#     api_key:                 该平台的 API 密钥
#       - quote0: Quote/0 平台密钥（dot.mindreset.tech）
#       - zectrix: Zectrix Note 4 密钥（zt_...，cloud.zectrix.com）
#
# devices:
#   - name: 设备的友好名称，用于识别和命令行操作
#   - device_id: 设备唯一标识符
#       * quote0: 服务商分配的设备 ID
#       * zectrix: 设备 MAC 地址，格式 AA:BB:CC:DD:EE:FF
#   - platform: 设备所属平台（可选，默认 quote0）
#       * quote0: Quote/0，分辨率 296x152，支持文本+图片
#       * zectrix: Zectrix Note 4，分辨率 400x300，仅图片（不支持 text 任务）
#   - api_key: 设备级 API 密钥覆盖（可选，覆盖 platforms.<name>.api_key）
#   - show_battery_icon: 在图像右下角显示电池图标（可选，默认 false；Note 4 无状态接口）
#   - show_battery_percentage: 在图像右下角显示电量百分比（可选，默认 false）
#   - show_refresh_time: 在图像右下角显示刷新时间（可选，默认 false）
#   - schedules: 该设备的定时任务列表
#
# schedules:
#   - cron: Cron 表达式，定义任务执行时间
#     格式：分 时 日 月 周 (5个字段)
#     例子：
#       "*/5 * * * *"     - 每5分钟
#       "0 9-18 * * 1-5"  - 工作日每小时
#       "0 12 * * *"      - 每天中午12点
#       "*/30 9-17 * * 1-5" - 工作日工作时间内每30分钟
#
#   - type: 消息类型，支持以下类型：
#     * text: 文本消息（仅 quote0 平台支持）
#     * work: 工作倒计时
#     * code_status: 代码状态监控
#     * image: 图像显示
#     * title_image: 生成标题图像
#     * umami_stats: Umami 网站统计数据
#     * github_contributions: GitHub 贡献图表
#     * code_plan_usage: 代码计划用量进度条
#
#   - params: 消息参数（可选），根据消息类型不同而不同：
#
#     text 类型参数：
#       - title: 消息标题（可选）
#       - message: 消息内容（必填）
#       - signature: 签名（可选，默认当前时间）
#       - icon: PNG Base64 图标数据或可匿名访问的 http(s) 图片 URL（可选）
#       - link: 点击链接（可选）
#       - task_key: Text API 任务 key（可选）
#       - task_alias: Text API 任务别名（可选）
#       - styles: Dot. Text API 字体样式对象（可选）
#
#     work 类型参数：
#       - clock_in: 上班时间，格式 "HH:MM"（可选，默认 "09:00"）
#       - clock_out: 下班时间，格式 "HH:MM"（可选，默认 "18:00"）
#
#     code_status 类型参数：
#       - wakatime_url: Wakatime 服务器 URL（必填）
#       - wakatime_api_key: Wakatime API 密钥（必填）
#       - wakatime_user_id: Wakatime 用户 ID（必填）
#       - link: 点击链接（可选）
#       - border: 边框颜色（可选，0=白色，1=黑色）
#       - task_key: Image API 任务 key（可选）
#       - task_alias: Image API 任务别名（可选）
#       - dither_type: 抖动类型（可选，DIFFUSION/ORDERED/NONE）
#       - dither_kernel: 抖动内核（可选）
#
#     image 类型参数：
#       - image_data: 图像二进制数据（必填）
#       - link: 点击链接（可选，Quote/0）
#       - border: 边框颜色（可选，0=白色，1=黑色，Quote/0）
#       - task_key: Image API 任务 key（可选，Quote/0）
#       - task_alias: Image API 任务别名（可选，Quote/0）
#       - page_id: Note 4 页面编号 1-5（可选，持久化到设备页面）
#       - dither_type: 抖动类型（可选；Note 4 上 NONE=关闭抖动，其他=开启）
#       - dither_kernel: 抖动内核（可选，Quote/0）
#
#     title_image 类型参数：
#       - main_title: 主标题（必填）
#       - sub_title: 副标题（可选）
#       - link: 点击链接（可选）
#       - border: 边框颜色（可选，0=白色，1=黑色）
#       - task_key: Image API 任务 key（可选）
#       - task_alias: Image API 任务别名（可选）
#       - page_id: Note 4 页面编号 1-5（可选）
#       - dither_type: 抖动类型（可选）
#       - dither_kernel: 抖动内核（可选）
#
#     umami_stats 类型参数：
#       - umami_host: Umami 服务器 URL（必填）
#       - umami_website_id: 网站 ID（必填）
#       - umami_api_key: Umami API 密钥（必填）
#       - umami_time_range: 时间范围（可选，默认 "24h"，支持 7d、24h、30d 等）
#       - link: 点击链接（可选）
#       - border: 边框颜色（可选，0=白色，1=黑色）
#       - task_key: Image API 任务 key（可选）
#       - task_alias: Image API 任务别名（可选）
#       - dither_type: 抖动类型（可选）
#       - dither_kernel: 抖动内核（可选）
#
#     github_contributions 类型参数：
#       - github_username: GitHub 用户名（必填）
#       - github_token: GitHub Personal Access Token（必填）
#       - link: 点击链接（可选）
#       - border: 边框颜色（可选，0=白色，1=黑色）
#       - task_key: Image API 任务 key（可选）
#       - task_alias: Image API 任务别名（可选）
#       - dither_type: 抖动类型（可选）
#       - dither_kernel: 抖动内核（可选）
#
#     code_plan_usage 类型参数：
#       - api_url: API 基础 URL（必填）
#       - provider: 提供商名称（可选，默认 "anthropic"）
#       - api_username: Basic Auth 用户名（可选）
#       - api_password: Basic Auth 密码（可选）
#       - link: 点击链接（可选）
#       - border: 边框颜色（可选，0=白色，1=黑色）
#       - task_key: Image API 任务 key（可选）
#       - task_alias: Image API 任务别名（可选）
#       - dither_type: 抖动类型（可选）
#       - dither_kernel: 抖动内核（可选）
